<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Got an idea? Let's make it real.">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#19c6b5"/>
      <stop offset="0.35" stop-color="#7fe3d8"/>
      <stop offset="0.5" stop-color="#ffd3a8"/>
      <stop offset="0.65" stop-color="#f2a35e"/>
      <stop offset="1" stop-color="#19c6b5"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#f28a3a"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="260" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c0f07"/><stop offset=".5" stop-color="#0d0f12"/><stop offset="1" stop-color="#05161a"/></linearGradient>
  </defs>
  <style>
    .t{font:800 46px 'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:url(#sweep)}
    .s{font:500 18px 'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#c9d1d9}
    .m{font:600 14px 'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;fill:#7fe3d8;letter-spacing:2px}
    .w1{animation:wv 9s linear infinite} .w2{animation:wv 13s linear infinite reverse} .w3{animation:wv 18s linear infinite}
    @keyframes wv{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    .in{opacity:0;animation:up 1s cubic-bezier(.16,1,.3,1) forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .p{fill:#ffd9b0;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
    .plane{animation:fly 7s ease-in-out infinite}
    @keyframes fly{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,-10px) rotate(-6deg)}100%{transform:translate(0,0) rotate(0)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle class="p" cx="90" cy="40" r="1.6" style="animation-delay:0.3s"/><circle class="p" cx="220" cy="90" r="1.2" style="animation-delay:1.4s"/><circle class="p" cx="980" cy="50" r="2" style="animation-delay:0.8s"/><circle class="p" cx="1110" cy="110" r="1.4" style="animation-delay:2s"/><circle class="p" cx="760" cy="30" r="1.3" style="animation-delay:1.1s"/><circle class="p" cx="420" cy="28" r="1.5" style="animation-delay:2.4s"/><circle class="p" cx="1050" cy="30" r="1.2" style="animation-delay:0.1s"/>
    <path class="w3" d="M0 196 q100.0 -14 200.0 0 t200.0 0 q100.0 -14 200.0 0 t200.0 0 q100.0 -14 200.0 0 t200.0 0 q100.0 -14 200.0 0 t200.0 0 q100.0 -14 200.0 0 t200.0 0 q100.0 -14 200.0 0 t200.0 0 V260 H0 Z" fill="#14b8a6" opacity=".10"/>
    <path class="w2" d="M0 212 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 q75.0 -18 150.0 0 t150.0 0 V260 H0 Z" fill="#f28a3a" opacity=".14"/>
    <path class="w1" d="M0 230 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 q50.0 -10 100.0 0 t100.0 0 V260 H0 Z" fill="#14b8a6" opacity=".22"/>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="22" fill="none" stroke="#30363d"/>
  <text class="m in d1" x="600.0" y="58" text-anchor="middle">// END OF FILE · START OF SOMETHING</text>
  <text class="t in d2" x="600.0" y="118" text-anchor="middle">Got an idea? Let's make it real.</text>
  <text class="s in d3" x="600.0" y="156" text-anchor="middle">mauricionunez2011@gmail.com  ·  linkedin.com/in/mauricionunez-dev</text>
  <g class="plane" transform-origin="0 0"><g transform="translate(1000,96)" fill="none" stroke="#f2a35e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-16 -2l32-12-10 30-7-12z"/><path d="M-1 4l17-18"/></g></g>
</svg>
