<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05161a"/>
      <stop offset="0.55" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#1c0f07"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19c6b5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#19c6b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f28a3a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f28a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd3a8"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sailG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd3a8" stop-opacity=".95"/><stop offset="1" stop-color="#f28a3a" stop-opacity=".55"/></linearGradient>
    <linearGradient id="hullG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4523"/><stop offset="1" stop-color="#2a140a"/></linearGradient>
    <linearGradient id="wingG" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#19c6b5" stop-opacity=".55"/><stop offset="1" stop-color="#19c6b5" stop-opacity="0"/></linearGradient>
    <radialGradient id="flame" cx=".7" cy=".5" r=".6"><stop offset="0" stop-color="#fff2d6"/><stop offset=".4" stop-color="#f2a35e"/><stop offset="1" stop-color="#f28a3a" stop-opacity="0"/></radialGradient>
    <clipPath id="r"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .k{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:5px;fill:#7fe3d8}
    .name{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#shine)}
    .sub{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#d9d4cb}
    .sub tspan.o{fill:#f2a35e;font-weight:700}
    .in{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.55s}.d3{animation-delay:.9s}.d4{animation-delay:1.25s}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .b1{animation:f1 14s ease-in-out infinite}
    .b2{animation:f2 16s ease-in-out infinite}
    @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,40px)}}
    @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-30px)}}
    .p{fill:#ffd9b0;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
    .chip rect{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.22)}
    .chip text{font:600 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ede9e1}
    .line{stroke:url(#shine);stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s 1.1s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .shipbob{transform-origin:0 0;animation:bob 6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(-6px,-12px) rotate(2deg)}}
    .sail{transform-box:fill-box;transform-origin:0% 50%;animation:billow 3s ease-in-out infinite}.s2{animation-delay:.6s}
    @keyframes billow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
    .flag{transform-box:fill-box;transform-origin:0% 50%;animation:wave 1.2s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(8deg) scaleX(.85)}}
    .flame{transform-box:fill-box;transform-origin:100% 50%;animation:burn .35s ease-in-out infinite alternate}
    @keyframes burn{from{transform:scaleX(.75);opacity:.75}to{transform:scaleX(1.15);opacity:1}}
    .wing{transform-box:fill-box;transform-origin:100% 0%;animation:flap 4s ease-in-out infinite}
    @keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
    .trail{animation:drift 1.6s linear infinite}.t2{animation-duration:2.2s}
    @keyframes drift{to{stroke-dashoffset:32}}
    .glowpulse{animation:gp 6s ease-in-out infinite}
    @keyframes gp{0%,100%{opacity:.12}50%{opacity:.28}}
    @media (prefers-reduced-motion: reduce){.shipbob,.sail,.flag,.flame,.wing,.trail,.glowpulse{animation:none}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <ellipse class="b1" cx="250" cy="250" rx="380" ry="230" fill="url(#teal)"/>
    <ellipse class="b2" cx="1000" cy="90" rx="380" ry="230" fill="url(#orange)"/>
    <g>
      <circle class="p" cx="640" cy="70" r="2" style="animation-delay:.2s"/>
      <circle class="p" cx="720" cy="150" r="1.6" style="animation-delay:1.1s"/>
      <circle class="p" cx="820" cy="210" r="2.2" style="animation-delay:.6s"/>
      <circle class="p" cx="905" cy="120" r="1.5" style="animation-delay:1.8s"/>
      <circle class="p" cx="980" cy="260" r="2" style="animation-delay:.9s"/>
      <circle class="p" cx="1080" cy="180" r="1.7" style="animation-delay:2.3s"/>
      <circle class="p" cx="560" cy="250" r="1.4" style="animation-delay:1.4s"/>
      <circle class="p" cx="1130" cy="60" r="2" style="animation-delay:.4s"/>
      <circle class="p" cx="760" cy="40" r="1.3" style="animation-delay:2.6s"/>
      <circle class="p" cx="680" cy="300" r="1.8" style="animation-delay:2s"/>
    </g>
    <g transform="translate(70,0)">
      <text class="k in d1" x="0" y="88">FULL STACK DEVELOPER · FRONTEND EXPERT</text>
      <text class="name in d2" x="-3" y="160">Mauro Nuñez</text>
      <line class="line" x1="0" y1="182" x2="420" y2="182"/>
      <text class="sub in d3" x="0" y="222">A great idea deserves a product people <tspan class="o">want to use.</tspan></text>
      <g class="in d4">
        <g class="chip" transform="translate(0,248)"><rect width="78" height="32" rx="16"/><text x="39" y="21" text-anchor="middle">React</text></g>
        <g class="chip" transform="translate(88,248)"><rect width="62" height="32" rx="16"/><text x="31" y="21" text-anchor="middle">Vue</text></g>
        <g class="chip" transform="translate(160,248)"><rect width="62" height="32" rx="16"/><text x="31" y="21" text-anchor="middle">PHP</text></g>
        <g class="chip" transform="translate(232,248)"><rect width="104" height="32" rx="16"/><text x="52" y="21" text-anchor="middle">WordPress</text></g>
        <g class="chip" transform="translate(346,248)"><rect width="76" height="32" rx="16"/><text x="38" y="21" text-anchor="middle">UX/UI</text></g>
        <g class="chip" transform="translate(432,248)"><rect width="150" height="32" rx="16"/><text x="75" y="21" text-anchor="middle">AI-driven dev ✦</text></g>
      </g>
    </g>
    <g transform="translate(985,190) scale(.86)">
      <g class="shipbob">
        <ellipse cx="0" cy="78" rx="150" ry="16" fill="#19c6b5" opacity=".18" class="glowpulse"/>
        <path class="trail" d="M-150,34 C-230,30 -300,60 -380,40" fill="none" stroke="#ffd9b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 14" opacity=".55"/>
        <path class="trail t2" d="M-150,48 C-220,50 -280,85 -350,72" fill="none" stroke="#7fe3d8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 12" opacity=".45"/>
        <g class="flame"><ellipse cx="-138" cy="40" rx="26" ry="8" fill="url(#flame)"/></g>
        <g class="wing"><path d="M-30,44 C-95,82 -165,70 -205,46 C-150,58 -95,52 -40,32 Z" fill="url(#wingG)" stroke="#7fe3d8" stroke-opacity=".6"/></g>
        <path d="M60,-70 L172,-2 L64,-4 Z" fill="#7fe3d8" opacity=".22" stroke="#7fe3d8" stroke-opacity=".5"/>
        <line x1="-10" y1="28" x2="-10" y2="-122" stroke="#c9a27a" stroke-width="3"/>
        <line x1="56" y1="26" x2="56" y2="-88" stroke="#c9a27a" stroke-width="2.5"/>
        <line x1="125" y1="20" x2="178" y2="-4" stroke="#c9a27a" stroke-width="2.5"/>
        <path class="sail" d="M-12,-114 C48,-98 54,-32 -8,-8 C12,-42 12,-82 -12,-114 Z" fill="url(#sailG)" stroke="#ffd3a8" stroke-opacity=".8"/>
        <path class="sail s2" d="M54,-82 C98,-66 100,-20 58,-6 C72,-32 72,-58 54,-82 Z" fill="url(#sailG)" stroke="#ffd3a8" stroke-opacity=".8"/>
        <path class="flag" d="M-10,-122 L22,-116 L-10,-108 Z" fill="#14b8a6"/>
        <path d="M-125,18 Q-112,58 -60,66 L72,66 Q118,58 134,14 L104,22 L-98,26 Z" fill="url(#hullG)" stroke="#f2a35e" stroke-opacity=".7" stroke-width="1.5"/>
        <path d="M-112,38 L120,34" stroke="#19c6b5" stroke-width="2" opacity=".8"/>
        <g fill="#ffd9b0"><circle class="p" cx="-62" cy="48" r="3.2"/><circle class="p" cx="-30" cy="48" r="3.2" style="animation-delay:.5s"/><circle class="p" cx="2" cy="48" r="3.2" style="animation-delay:1s"/><circle class="p" cx="34" cy="48" r="3.2" style="animation-delay:1.5s"/><circle class="p" cx="66" cy="48" r="3.2" style="animation-delay:2s"/></g>
      </g>
    </g>
  </g>
</svg>
