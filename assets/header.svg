<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05161a"/>
      <stop offset="0.55" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#1c0f07"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19c6b5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#19c6b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f28a3a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f28a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd3a8"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .k{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:5px;fill:#7fe3d8}
    .name{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#shine)}
    .sub{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#d9d4cb}
    .sub tspan.o{fill:#f2a35e;font-weight:700}
    .in{opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.55s}.d3{animation-delay:.9s}.d4{animation-delay:1.25s}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .b1{animation:f1 14s ease-in-out infinite}
    .b2{animation:f2 16s ease-in-out infinite}
    @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,40px)}}
    @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-30px)}}
    .p{fill:#ffd9b0;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
    .chip rect{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.22)}
    .chip text{font:600 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ede9e1}
    .line{stroke:url(#shine);stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s 1.1s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <ellipse class="b1" cx="250" cy="250" rx="380" ry="230" fill="url(#teal)"/>
    <ellipse class="b2" cx="1000" cy="90" rx="380" ry="230" fill="url(#orange)"/>
    <g>
      <circle class="p" cx="640" cy="70" r="2" style="animation-delay:.2s"/>
      <circle class="p" cx="720" cy="150" r="1.6" style="animation-delay:1.1s"/>
      <circle class="p" cx="820" cy="210" r="2.2" style="animation-delay:.6s"/>
      <circle class="p" cx="905" cy="120" r="1.5" style="animation-delay:1.8s"/>
      <circle class="p" cx="980" cy="260" r="2" style="animation-delay:.9s"/>
      <circle class="p" cx="1080" cy="180" r="1.7" style="animation-delay:2.3s"/>
      <circle class="p" cx="560" cy="250" r="1.4" style="animation-delay:1.4s"/>
      <circle class="p" cx="1130" cy="60" r="2" style="animation-delay:.4s"/>
      <circle class="p" cx="760" cy="40" r="1.3" style="animation-delay:2.6s"/>
      <circle class="p" cx="680" cy="300" r="1.8" style="animation-delay:2s"/>
    </g>
    <g transform="translate(70,0)">
      <text class="k in d1" x="0" y="88">FULL STACK DEVELOPER · FRONTEND EXPERT</text>
      <text class="name in d2" x="-3" y="160">Mauro Núñez</text>
      <line class="line" x1="0" y1="182" x2="420" y2="182"/>
      <text class="sub in d3" x="0" y="222">A great idea deserves a product people <tspan class="o">want to use.</tspan></text>
      <g class="in d4">
        <g class="chip" transform="translate(0,248)"><rect width="78" height="32" rx="16"/><text x="39" y="21" text-anchor="middle">React</text></g>
        <g class="chip" transform="translate(88,248)"><rect width="62" height="32" rx="16"/><text x="31" y="21" text-anchor="middle">Vue</text></g>
        <g class="chip" transform="translate(160,248)"><rect width="62" height="32" rx="16"/><text x="31" y="21" text-anchor="middle">PHP</text></g>
        <g class="chip" transform="translate(232,248)"><rect width="104" height="32" rx="16"/><text x="52" y="21" text-anchor="middle">WordPress</text></g>
        <g class="chip" transform="translate(346,248)"><rect width="76" height="32" rx="16"/><text x="38" y="21" text-anchor="middle">UX/UI</text></g>
        <g class="chip" transform="translate(432,248)"><rect width="150" height="32" rx="16"/><text x="75" y="21" text-anchor="middle">AI-driven dev ✦</text></g>
      </g>
    </g>
  </g>
</svg>
