<svg xmlns="http://www.w3.org/2000/svg" width="900" height="78" viewBox="0 0 900 78" role="img" aria-label="Things I've built">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#19c6b5"/>
      <stop offset="0.35" stop-color="#7fe3d8"/>
      <stop offset="0.5" stop-color="#ffd3a8"/>
      <stop offset="0.65" stop-color="#f2a35e"/>
      <stop offset="1" stop-color="#19c6b5"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#30363d"/>
      <stop offset="1" stop-color="#f28a3a"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="898" height="76" rx="16"/></clipPath>
  </defs>
  <style>
    .k{font:600 12px 'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:3px;fill:#7fe3d8}
    .t{font:800 30px 'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:url(#sweep)}
    .s{font:500 14px 'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#8b949e}
    .ic{fill:none;stroke:#f2a35e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .orb{fill:none;stroke:#14b8a6;stroke-width:1.5;stroke-dasharray:4 6;transform-origin:52px 39px;animation:spin 9s linear infinite}
    .pulse{fill:#14b8a6;transform-origin:52px 39px;animation:pulse 2.8s ease-out infinite}
    .dot{fill:#f2a35e;transform-origin:52px 39px;animation:spin 4.5s linear infinite}
    .beat{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 2.2s ease-in-out infinite}
    .bar{transform-origin:0 0;animation:grow 1.4s .3s cubic-bezier(.16,1,.3,1) both}
    .st{animation:streak 6s ease-in-out infinite}
    .eq rect{fill:#14b8a6;transform-box:fill-box;transform-origin:bottom;animation:eq 1.2s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%{transform:scale(.6);opacity:.45}100%{transform:scale(1.5);opacity:0}}
    @keyframes draw{0%{stroke-dashoffset:60}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes streak{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1200px)}}
    @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="900" height="78" fill="#0d1117"/>
    <rect class="st" x="0" y="0" width="260" height="78" fill="url(#streak)"/>
  </g>
  <rect x="1" y="1" width="898" height="76" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <circle class="pulse" cx="52" cy="39" r="24"/>
  <circle cx="52" cy="39" r="22" fill="#111c22" stroke="#1f2a30"/>
  <circle class="orb" cx="52" cy="39" r="27"/>
  <circle class="dot" cx="52" cy="12" r="3"/>
  <g class="ic" transform="translate(52,39)"><path d="M0 -11l11 6-11 6-11-6z"/><path d="M-11 1l11 6 11-6"/><path d="M-11 6l11 6 11-6" opacity=".6"/></g>
  <text class="k" x="100" y="28">03 // PROJECTS</text>
  <text class="t" x="98" y="61">Things I've built</text>
  <text class="s" x="876" y="44" text-anchor="end">they move: scroll through them</text>
  <g class="eq" transform="translate(820,52)">
    <rect x="0" y="0" width="4" height="12" rx="2" style="animation-delay:0.00s;opacity:0.5"/><rect x="8" y="0" width="4" height="12" rx="2" style="animation-delay:0.15s;opacity:0.6"/><rect x="16" y="0" width="4" height="12" rx="2" style="animation-delay:0.30s;opacity:0.7"/><rect x="24" y="0" width="4" height="12" rx="2" style="animation-delay:0.45s;opacity:0.5"/><rect x="32" y="0" width="4" height="12" rx="2" style="animation-delay:0.60s;opacity:0.6"/><rect x="40" y="0" width="4" height="12" rx="2" style="animation-delay:0.75s;opacity:0.7"/><rect x="48" y="0" width="4" height="12" rx="2" style="animation-delay:0.90s;opacity:0.5"/>
  </g>
  <rect class="bar" x="100" y="68" width="160" height="3" rx="1.5" fill="url(#edge)"/>
</svg>
