      <circle r="20" fill="#f2a35e" opacity=".12"/>
      <circle class="halo" r="20" fill="none" stroke="#f2a35e" style="animation-delay:2.7s"/>
      <g class="ic" stroke="#f2a35e"><path d="M0 -11l2.6 7.4L10 -1l-7.4 2.6L0 9l-2.6-7.4L-10 -1l7.4-2.6z"/></g>
    </g>
    <text class="h" x="705" y="90">AI-driven</text>
    <text class="p" x="705" y="112">Claude Code and Codex,</text><text class="p" x="705" y="132">every day: experience sets</text><text class="p" x="705" y="152">judgment, AI multiplies it</text>
  </g>
</svg>
